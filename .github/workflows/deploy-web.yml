name: Deploy web app to GitHub Pages

# Publishes nonogram-web to https://imsvale.github.io/nonogram/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "nonogram-web/**"
      - "nonogram-wasm/**"
      - "nonogram-core/**"
      - "nonogram-propagation/**"
      - "nonogram-graph-search/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nonogram-web
    steps:
      - uses: actions/checkout@v4

      # nonogram-web imports the compiled nonogram-wasm package at build time (src/wasm/pkg,
      # gitignored like any other build output) — it has to exist before `npm test`/`npm run
      # build` run, or tsc fails to resolve the module.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: jetli/wasm-pack-action@v0.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nonogram-web/package-lock.json

      - run: npm ci
      - run: npm run build:wasm
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nonogram-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
