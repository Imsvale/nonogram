name: Build Linux release binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (iced/winit + rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libwayland-egl1-mesa \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p nonogram-gui -p nonogram-cli

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/nonogram target/release/nonogram-cli dist/
          tar -C dist -czf nonogram-linux-x64.tar.gz nonogram nonogram-cli

      - uses: actions/upload-artifact@v4
        with:
          name: nonogram-linux-x64
          path: nonogram-linux-x64.tar.gz
