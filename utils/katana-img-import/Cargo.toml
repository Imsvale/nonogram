[package]
name = "katana-img-import"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "katana-img-import"
path = "src/main.rs"

[dependencies]
image       = { version = "0.25", default-features = false, features = ["webp", "png"] }
ureq        = { version = "2", features = ["json"] }
serde_json  = "1"
