[package]
name = "nonogram-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nonogram-core = { path = "../nonogram-core" }
nonogram-graph-search = { path = "../nonogram-graph-search" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
