[package]
name = "nonogram-gui"
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/Imsvale/nonogram"

[[bin]]
name = "nonogram"
path = "src/main.rs"

[dependencies]
nonogram-core         = { path = "../nonogram-core" }
nonogram-propagation  = { path = "../nonogram-propagation" }
nonogram-human-by-ai  = { path = "../nonogram-human-by-ai" }
nonogram-graph-search = { path = "../nonogram-graph-search" }
nonogram-human        = { path = "../nonogram-human" }
iced         = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "fira-sans", "tokio", "advanced"] }
rfd          = "0.15"
tokio        = { version = "1", features = ["rt-multi-thread"] }
iced_fonts   = { version = "0.1.1", features = ["bootstrap"] }
directories  = "5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image        = { version = "0.25", default-features = false, features = ["ico"] }

[build-dependencies]
