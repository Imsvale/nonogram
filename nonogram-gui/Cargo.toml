[package]
name = "nonogram-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
nonogram-core         = { path = "../nonogram-core" }
nonogram-propagation  = { path = "../nonogram-propagation" }
nonogram-human-by-ai  = { path = "../nonogram-human-by-ai" }
nonogram-graph-search = { path = "../nonogram-graph-search" }
nonogram-human        = { path = "../nonogram-human" }
iced         = { version = "0.13", features = ["tokio", "advanced"] }
rfd          = "0.15"
tokio        = { version = "1", features = ["rt-multi-thread"] }
iced_fonts   = { version = "0.1.1", features = ["bootstrap"] }
directories  = "5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls"] }
